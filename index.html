.destination-select-wrap:after{content:"⌄";position:absolute;right:10px;top:50%;transform:translateY(-57%);color:#f4f8f1;font-size:14px;pointer-events:none}
.destination-select{width:100%;min-width:148px;max-width:190px;height:32px;padding:0 29px 0 11px;border:0;border-radius:4px;appearance:none;background:#2e6551;color:#fff;font:12px/1.4 var(--sans);outline:none;cursor:pointer}
.destination-select:hover{background:#285c49}.destination-select:focus-visible{outline:3px solid #c3964d;outline-offset:3px}
@media(max-width:700px){.destination-switch{width:auto;min-width:0;max-width:calc(100vw - 36px);padding:3px 3px 3px 9px;gap:7px;overflow:visible}.destination-caption{font-size:9px}.destination-select{min-width:139px;max-width:170px;height:30px;font-size:11px}}
