<h2>香山公园样片数据来源</h2>
<p>这是香山公园轻量化 3D 山地样片的第一版地图骨架，不替代官方地图、现场导览或导航。</p>
<p>水面、道路、步道、建筑轮廓和景点坐标来自 <a href="https://www.openstreetmap.org/way/76162983" target="_blank" rel="noopener">OpenStreetMap</a>，提取日期为 2026-09-25，坐标采用 WGS84。当前范围保留 20 片水面、1480 段道路与步道、285 个建筑轮廓。</p>
<p>公园概况和景点信息参考 <a href="https://xiangshanpark.com/cn/" target="_blank" rel="noopener">香山公园官方网站</a>和<a href="https://yllhj.beijing.gov.cn/ggfw/bjsggml/lsmy/lsmy2/202206/t20220620_2746561.shtml" target="_blank" rel="noopener">北京市园林绿化局香山公园名录</a>。香炉峰海拔575米；当前山体起伏为轻量化示意，并非测绘地形。</p>
<p>首版设置东门、静翠湖、双清别墅、香山寺、碧云寺和香炉峰六个导览点。下一步将补充实景照片和推荐路线。</p>
